name: Android APK ve AAB Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Proje Dosyalarini Cek
        uses: actions/checkout@v4

      - name: 2. Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 4. Imza Klasor Izinlerini Ac ve Flet Kur
        run: |
          mkdir -p /home/runner/.android /home/runner/.config/.android
          sudo chown -R $USER:$USER /home/runner/.android /home/runner/.config
          chmod -R 777 /home/runner/.android /home/runner/.config/.android
          keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp /home/runner/.config/.android/debug.keystore /home/runner/.android/debug.keystore || true
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          pip install --upgrade pip
          pip install "flet[all]" fpdf2 Pillow

      - name: 5. Android APK Derle (Otomatik Onayli)
        env:
          CI: true
        run: |
          yes | flet build apk --yes --project teklifcepte --org com.teklifcepte.pro

      - name: 6. Google Play AAB Derle (Otomatik Onayli)
        env:
          CI: true
        run: |
          yes | flet build aab --yes --project teklifcepte --org com.teklifcepte.pro

      - name: 7. Hazir Paketleri Indirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: TeklifCepte-Android-Paketleri
          path: |
            build/apk/*.apk
            build/aab/*.aab
