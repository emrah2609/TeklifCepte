name: Android APK ve AAB Uretici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Proje Dosyalarini Cek
        uses: actions/checkout@v4

      - name: 2. Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 4. Flutter SDK Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 5. Flet ve Kutuphaneleri Kur
        run: |
          pip install --upgrade pip
          pip install "flet[all]" fpdf2 Pillow

      - name: 6. Android APK Derle (Telefon Testi Icin)
        env:
          CI: true
        run: |
          flet build apk --project "TeklifCepte Pro" --org "com.teklifcepte.pro"

      - name: 7. Google Play AAB Derle (Magaza Icin)
        env:
          CI: true
        run: |
          flet build aab --project "TeklifCepte Pro" --org "com.teklifcepte.pro"

      - name: 8. Hazir Paketleri Indirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: TeklifCepte-Android-Paketleri
          path: |
            build/apk/*.apk
            build/aab/*.aab
